# Compila e pubblica l'app su GitHub Pages.
#
# Il deploy passa solo se passano anche le prove sul browser. Una PWA che si
# apre bianca senza rete supera qualunque unit test: è già successo, ed è il
# motivo per cui `npm run offline` sta qui dentro e non in un controllo
# facoltativo.
#
# Prima del primo giro: Settings > Pages > Source = "GitHub Actions".
name: Deploy

on:
  push:
    branches:
      - main
      - claude/calisthenics-pwa-offline-kor52w
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy alla volta, senza annullare quello in corso: l'ultimo push vince
# comunque, ma nessuna pubblicazione resta a metà.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Typecheck, unit test e il controllo che non esistano URL di video
      # scritti a mano. Non serve un browser.
      - name: Verifica
        run: npm run verify

      - name: Installa Chromium
        run: npx playwright install --with-deps chromium

      - name: Prova di fumo
        run: npm run smoke

      - name: Prova offline
        run: npm run offline

  deploy:
    name: Pubblica
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # `enablement` accende Pages da solo al primo giro. Se il token non
      # basta, la strada manuale è Settings > Pages > Source = GitHub Actions.
      - name: Prepara Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # I percorsi nel build sono relativi (base: './' in vite.config.ts),
      # quindi l'app funziona servita da /Training/ senza altre configurazioni.
      - name: Build
        run: npm run build

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
